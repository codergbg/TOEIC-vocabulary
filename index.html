<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>托业单词通 - TOEIC Vocabulary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f0f23;
            --secondary: #1a1a3e;
            --card-bg: #16213e;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --success: #10b981;
            --success-light: #34d399;
            --warning: #f59e0b;
            --error: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --btn-bg: #1e293b;
            --border-color: #334155;
            --glow: rgba(99, 102, 241, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(30, 41, 59, 0.5) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .app-container {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
        }

        /* Header */
        .header {
            background: rgba(26, 26, 62, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-stat-icon {
            font-size: 14px;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Page transitions */
        .page {
            display: none;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Progress */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-count {
            font-size: 14px;
            color: var(--accent);
            font-weight: 500;
        }

        .progress-bar {
            background: var(--btn-bg);
            border-radius: 12px;
            height: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: var(--accent-gradient);
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        /* Word Card */
        .word-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(99, 102, 241, 0.1);
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .word-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 30px var(--glow);
        }

        .word-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }

        .word-card.flipped::before {
            background: linear-gradient(90deg, var(--success), var(--accent-light));
        }

        .word-main {
            margin-bottom: 20px;
        }

        .word {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .phonetic {
            font-size: 18px;
            color: var(--accent);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

        .word-meaning {
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding: 20px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 14px;
            border-left: 4px solid var(--accent);
            line-height: 1.6;
        }

        .word-example {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            padding: 16px;
            background: var(--btn-bg);
            border-radius: 12px;
            font-style: italic;
        }

        .word-example-cn {
            font-size: 14px;
            color: var(--warning);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .speak-word-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 15px var(--glow);
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .speak-word-btn:active {
            transform: scale(0.9);
        }

        .speak-word-btn.playing {
            animation: pulse 0.8s infinite;
        }

        .card-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 12px;
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 14px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-know {
            background: var(--success);
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-know:hover {
            background: var(--success-light);
            box-shadow: 0 6px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-dont-know {
            background: var(--btn-bg);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-dont-know:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .btn-next {
            background: var(--accent-gradient);
            color: white;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 20px var(--glow);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--glow);
        }

        /* Completed State */
        .completed-state {
            text-align: center;
            padding: 40px 20px;
        }

        .completed-icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .completed-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .completed-subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .completed-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .mini-stat {
            background: var(--btn-bg);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

        .mini-stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
        }

        .mini-stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 62, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            z-index: 1000;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
            text-decoration: none;
            position: relative;
            border-radius: 12px;
        }

        .nav-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
        }

        /* Practice Page */
        .page-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .practice-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            margin-bottom: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .practice-card .word {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .practice-card .phonetic {
            font-size: 20px;
        }

        .speak-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .speak-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 30px var(--glow);
            transition: all 0.3s ease;
        }

        .speak-btn:active {
            transform: scale(0.92);
        }

        .speak-btn.playing {
            animation: pulse 0.8s infinite;
        }

        .speed-control {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .speed-btn {
            padding: 10px 20px;
            border-radius: 24px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .speed-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .speed-btn.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }

        .record-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .record-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: 3px solid var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--accent);
            transition: all 0.3s ease;
        }

        .record-btn:hover {
            background: rgba(99, 102, 241, 0.15);
        }

        .record-btn.recording {
            background: var(--accent);
            color: white;
            animation: pulse 1s infinite;
            box-shadow: 0 0 30px var(--glow);
        }

        .record-hint {
            color: var(--text-muted);
            font-size: 14px;
        }

        .playback-btn {
            padding: 12px 28px;
            background: var(--success);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }

        .playback-btn:hover {
            background: var(--success-light);
        }

        /* Test Page */
        .test-mode {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .test-mode-btn {
            flex: 1;
            padding: 18px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background: var(--btn-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .test-mode-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .test-mode-btn.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }

        .test-question {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .question-number {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }

        .question-progress {
            color: var(--accent);
            font-weight: 500;
        }

        .question-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.5;
        }

        .question-audio {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .audio-play-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            font-size: 28px;
            color: white;
            box-shadow: 0 6px 24px var(--glow);
            transition: all 0.3s ease;
        }

        .audio-play-btn:active {
            transform: scale(0.92);
        }

        .answer-input {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background: var(--btn-bg);
            color: var(--text-primary);
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .answer-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--glow);
        }

        .answer-input.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .answer-input.incorrect {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 18px 16px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background: var(--btn-bg);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        /* Results */
        .result-summary {
            text-align: center;
            padding: 40px 24px;
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .result-score {
            font-size: 72px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .result-label {
            font-size: 18px;
            color: var(--text-secondary);
            margin: 16px 0 28px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-item {
            background: var(--btn-bg);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* History */
        .history-section {
            margin-top: 28px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .stat-card h3 {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--btn-bg);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .history-date {
            font-size: 14px;
            color: var(--text-muted);
        }

        .history-score {
            font-size: 18px;
            font-weight: 600;
            color: var(--success);
        }

        .history-mode {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 8px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
        }

        /* Dictation submit button */
        .submit-btn {
            margin-top: 16px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
            }

            .word {
                font-size: 30px;
            }

            .practice-card .word {
                font-size: 36px;
            }

            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div>
                    <h1>托业单词通</h1>
                    <div class="subtitle">每天进步一点点</div>
                </div>
                <div class="header-stats">
                    <div class="header-stat">
                        <span class="header-stat-icon">📚</span>
                        <span id="total-words">0</span>
                    </div>
                    <div class="header-stat">
                        <span class="header-stat-icon">✅</span>
                        <span id="learned-count">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Learn Page -->
        <div id="learn-page" class="page active">
            <div class="progress-container">
                <div class="progress-header">
                    <span class="progress-text">今日进度</span>
                    <span class="progress-count"><span id="learn-progress">0</span>/10</span>
                </div>
                <div class="progress-bar">

        // App State
        let state = {
            learnedWords: [],
            currentIndex: 0,
            dailyWords: [],
            practiceIndex: 0,
            testMode: 'choice',
            testQuestions: [],
            currentQuestion: 0,
            correctAnswers: 0,
            speechRate: 1,
            isRecording: false,
            mediaRecorder: null,
            audioChunks: [],
            recordedAudio: null
        };

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem('toeic-vocab-state');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.learnedWords = parsed.learnedWords || [];
                state.dailyWords = parsed.dailyWords || [];
                state.practiceIndex = parsed.practiceIndex || 0;

                const lastDate = parsed.lastDate;
                const today = new Date().toDateString();
                if (lastDate !== today) {
                    state.dailyWords = [];
                    state.currentIndex = 0;
                }
            }
            updateHeaderStats();
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('toeic-vocab-state', JSON.stringify({
                learnedWords: state.learnedWords,
                dailyWords: state.dailyWords,
                practiceIndex: state.practiceIndex,
                lastDate: new Date().toDateString()
            }));
            updateHeaderStats();
        }

        function updateHeaderStats() {
            document.getElementById('total-words').textContent = VOCABULARY.length;
            document.getElementById('learned-count').textContent = state.learnedWords.length;
        }

        // Get today's words
        function getDailyWords() {
            if (state.dailyWords.length > 0) {
                return state.dailyWords;
            }

            const remaining = VOCABULARY.filter(w => !state.learnedWords.includes(w.word));
            const shuffled = [...remaining].sort(() => Math.random() - 0.5);
            state.dailyWords = shuffled.slice(0, 10);
            saveState();
            return state.dailyWords;
        }

        // Page switching
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(page + '-page').classList.add('active');
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');

            if (page === 'learn') {
                updateLearnPage();
            } else if (page === 'practice') {
                updatePracticePage();
            } else if (page === 'test') {
                updateTestStart();
            }
        }

        // Learn page
        function updateLearnPage() {
            const words = getDailyWords();
            const learnedToday = state.dailyWords.slice(0, state.currentIndex);

            document.getElementById('learn-progress').textContent = learnedToday.length;
            document.getElementById('progress-fill').style.width = (learnedToday.length / 10 * 100) + '%';

            if (words.length === 0 || state.currentIndex >= words.length) {
                document.getElementById('word-container').style.display = 'none';
                document.getElementById('completed-msg').style.display = 'block';
                document.getElementById('mastered-count').textContent = state.learnedWords.length;
                document.getElementById('total-learned').textContent = state.learnedWords.length;
                document.getElementById('remaining-words').textContent = VOCABULARY.length - state.learnedWords.length;
            } else {
                document.getElementById('word-container').style.display = 'block';
                document.getElementById('completed-msg').style.display = 'none';

                const word = words[state.currentIndex];
                document.getElementById('word-text').textContent = word.word;
                document.getElementById('phonetic').textContent = word.phonetic;
                document.getElementById('meaning').textContent = word.meaning;
                document.getElementById('example').textContent = word.example;
                document.getElementById('example-cn').textContent = word.exampleCn;

                document.getElementById('meaning').style.display = 'none';
                document.getElementById('example').style.display = 'none';
                document.getElementById('example-cn').style.display = 'none';
                document.getElementById('word-card').classList.remove('flipped');
            }
        }

        // 发音学习页面的当前单词
        function speakCurrentWord(e) {
            if (e) e.stopPropagation();
            const words = getDailyWords();
            if (state.currentIndex >= words.length) return;

            const word = words[state.currentIndex];
            const btn = document.getElementById('speak-word-btn');
            if (btn) btn.classList.add('playing');

            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word.word);
            utterance.lang = 'en-US';
            utterance.rate = state.speechRate;
            utterance.volume = 1;

            utterance.onend = () => {
                if (btn) btn.classList.remove('playing');
            };
            utterance.onerror = () => {
                if (btn) btn.classList.remove('playing');
            };

            setTimeout(() => speechSynthesis.speak(utterance), 100);
        }

        function flipCard() {
            const meaning = document.getElementById('meaning');
            const example = document.getElementById('example');
            const exampleCn = document.getElementById('example-cn');
            const card = document.getElementById('word-card');

            if (meaning.style.display === 'none') {
                meaning.style.display = 'block';
                example.style.display = 'block';
                exampleCn.style.display = 'block';
                card.classList.add('flipped');
            } else {
                meaning.style.display = 'none';
                example.style.display = 'none';
                exampleCn.style.display = 'none';
                card.classList.remove('flipped');
            }
        }

        function markKnow() {
            const words = getDailyWords();
            if (state.currentIndex < words.length) {
                const word = words[state.currentIndex];
                if (!state.learnedWords.includes(word.word)) {
                    state.learnedWords.push(word.word);
                }
                state.currentIndex++;
                saveState();
                updateLearnPage();
            }
        }

        function markDontKnow() {
            const words = getDailyWords();
            if (state.currentIndex < words.length) {
                state.currentIndex++;
                if (state.currentIndex >= words.length) {
                    state.currentIndex = 0;
                }
                saveState();
                updateLearnPage();
            }
        }

        function startOver() {
            state.learnedWords = [];
            state.dailyWords = [];
            state.currentIndex = 0;
            saveState();
            updateLearnPage();
        }

        // Practice page
        function updatePracticePage() {
            const words = state.learnedWords.length > 0
                ? VOCABULARY.filter(w => state.learnedWords.includes(w.word))
                : VOCABULARY;

            if (words.length === 0) {
                state.currentPracticeWord = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            } else {
                state.currentPracticeWord = words[state.practiceIndex % words.length];
            }

            document.getElementById('practice-word').textContent = state.currentPracticeWord.word;
            document.getElementById('practice-phonetic').textContent = state.currentPracticeWord.phonetic;
        }

        function speakWord() {
            const btn = document.getElementById('speak-btn');
            btn.classList.add('playing');

            // 移动端兼容：先停止之前的播放
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(state.currentPracticeWord.word);
            utterance.lang = 'en-US';
            utterance.rate = state.speechRate;
            utterance.volume = 1;

            utterance.onend = () => btn.classList.remove('playing');
            utterance.onerror = (e) => {
                console.log('Speech error:', e);
                btn.classList.remove('playing');
            };

            // 移动端需要短暂延迟确保音频上下文就绪
            setTimeout(() => {
                speechSynthesis.speak(utterance);
            }, 100);
        }

        function setSpeed(speed) {
            state.speechRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
            });
        }

        function nextPracticeWord() {
            state.practiceIndex++;
            saveState();
            updatePracticePage();
        }

        // Recording functionality
        async function toggleRecording() {
            const btn = document.getElementById('record-btn');

            if (!state.isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.mediaRecorder = new MediaRecorder(stream);
                    state.audioChunks = [];

                    state.mediaRecorder.ondataavailable = (e) => {
                        state.audioChunks.push(e.data);
                    };

                    state.mediaRecorder.onstop = () => {
                        const blob = new Blob(state.audioChunks, { type: 'audio/wav' });
                        state.recordedAudio = URL.createObjectURL(blob);
                        document.getElementById('playback-btn').style.display = 'block';
                    };

                    state.mediaRecorder.start();
                    state.isRecording = true;
                    btn.classList.add('recording');
                    btn.innerHTML = '⏹';
                } catch (err) {
                    alert('无法访问麦克风，请确保已授予权限');
                }
            } else {
                state.mediaRecorder.stop();
                state.isRecording = false;
                btn.classList.remove('recording');
                btn.innerHTML = '🎤';
            }
        }

        function playRecording() {
            if (state.recordedAudio) {
                const audio = new Audio(state.recordedAudio);
                audio.play();
            }
        }

        // Test page
        function selectTestMode(mode) {
            state.testMode = mode;
            document.querySelectorAll('.test-mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        function startTest() {
            const words = state.learnedWords.length > 0
                ? VOCABULARY.filter(w => state.learnedWords.includes(w.word))
                : VOCABULARY;

            if (words.length < 4) {
                alert('请先学习更多单词，至少需要4个单词才能开始测试');
                return;
            }

            state.testQuestions = [];
            for (let i = 0; i < 10; i++) {
                const correctWord = words[Math.floor(Math.random() * words.length)];
                const wrongOptions = VOCABULARY
                    .filter(w => w.word !== correctWord.word)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3)
                    .map(w => w.word);

                state.testQuestions.push({
                    correct: correctWord,
                    options: [correctWord.word, ...wrongOptions].sort(() => Math.random() - 0.5)
                });
            }

            state.currentQuestion = 0;
            state.correctAnswers = 0;

            document.getElementById('test-start').style.display = 'none';
            document.getElementById('test-content').style.display = 'block';
            document.getElementById('test-result').style.display = 'none';

            showQuestion();
        }

        function showQuestion() {
            const question = state.testQuestions[state.currentQuestion];
            document.getElementById('question-num').textContent = state.currentQuestion + 1;
            document.getElementById('test-progress').textContent = (state.currentQuestion + 1) + '/10';

            if (state.testMode === 'choice') {
                document.getElementById('question-text').textContent = question.correct.meaning;
                document.getElementById('question-audio').style.display = 'none';
                document.getElementById('dictation-input-area').style.display = 'none';
                document.getElementById('options-container').style.display = 'grid';

                const optionsHtml = question.options.map(opt =>
                    `<button class="option-btn" onclick="selectOption('${opt}')">${opt}</button>`
                ).join('');
                document.getElementById('options-container').innerHTML = optionsHtml;
            } else {
                document.getElementById('question-text').textContent = '听写单词';
                document.getElementById('question-audio').style.display = 'flex';
                document.getElementById('dictation-input-area').style.display = 'block';
                document.getElementById('options-container').style.display = 'none';
                document.getElementById('answer-input').value = '';
                document.getElementById('answer-input').classList.remove('correct', 'incorrect');
                document.getElementById('answer-input').focus();
            }
        }

        function playQuestionAudio() {
            // 移动端兼容：先停止之前的播放
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(state.testQuestions[state.currentQuestion].correct.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.volume = 1;

            setTimeout(() => {
                speechSynthesis.speak(utterance);
            }, 100);
        }

        function selectOption(word) {
            const question = state.testQuestions[state.currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === question.correct.word) {
                    btn.classList.add('correct');
                } else if (btn.textContent === word && word !== question.correct.word) {
                    btn.classList.add('incorrect');
                }
            });

            if (word === question.correct.word) {
                state.correctAnswers++;
            }

            setTimeout(() => {
                nextQuestion();
            }, 1000);
        }

        function submitDictation() {
            const answer = document.getElementById('answer-input').value.trim().toLowerCase();
            const question = state.testQuestions[state.currentQuestion];
            const input = document.getElementById('answer-input');

            if (answer === question.correct.word.toLowerCase()) {
                state.correctAnswers++;
                input.classList.add('correct');
                input.classList.remove('incorrect');
            } else {
                input.classList.add('incorrect');
                input.classList.remove('correct');
            }

            setTimeout(() => {
                input.classList.remove('correct', 'incorrect');
                nextQuestion();
            }, 1200);
        }

        function nextQuestion() {
            state.currentQuestion++;

            if (state.currentQuestion >= 10) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function showResult() {
            document.getElementById('test-content').style.display = 'none';
            document.getElementById('test-result').style.display = 'block';

            const score = Math.round(state.correctAnswers / 10 * 100);
            document.getElementById('result-score').textContent = score + '%';
            document.getElementById('correct-count').textContent = state.correctAnswers;
            document.getElementById('wrong-count').textContent = 10 - state.correctAnswers;

            const history = JSON.parse(localStorage.getItem('toeic-test-history') || '[]');
            history.unshift({
                date: new Date().toISOString(),
                score: score,
                correct: state.correctAnswers,
                total: 10,
                mode: state.testMode
            });
            localStorage.setItem('toeic-test-history', JSON.stringify(history.slice(0, 20)));
        }

        function backToTestStart() {
            document.getElementById('test-result').style.display = 'none';
            document.getElementById('test-start').style.display = 'block';
            updateTestStart();
        }

        function updateTestStart() {
            const history = JSON.parse(localStorage.getItem('toeic-test-history') || '[]');
            const historyList = document.getElementById('history-list');

            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">暂无测试记录</p>';
            } else {
                historyList.innerHTML = history.slice(0, 5).map(h => `
                    <div class="history-item">
                        <span class="history-date">${new Date(h.date).toLocaleDateString()}</span>
                        <div>
                            <span class="history-score">${h.score}%</span>
                            <span class="history-mode">${h.mode === 'choice' ? '选择' : '听写'}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Initialize
        loadState();
        updateLearnPage();
        updatePracticePage();
        updateTestStart();
    </script>
</body>
</html>
